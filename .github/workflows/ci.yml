name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rokit
        run: |
          curl -fsSL https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      - name: Install toolchain
        run: |
          rokit install --no-trust-check || true
          rojo --version

      - name: Install Lune
        run: |
          curl -fsSL -o /tmp/lune.zip \
            https://github.com/lune-org/lune/releases/download/v0.10.5/lune-0.10.5-linux-x86_64.zip
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/lune.zip').extractall('/tmp/lune')"
          chmod +x /tmp/lune/lune
          echo "/tmp/lune" >> "$GITHUB_PATH"

      - name: Luau tests
        run: lune run tests/StageDefinitions.spec.luau

      - name: Build place file
        run: |
          mkdir -p build
          rojo build default.project.json -o build/SkywardSprint.rbxlx
          test -s build/SkywardSprint.rbxlx
          ls -la build

      - name: Upload place artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkywardSprint-place
          path: build/SkywardSprint.rbxlx
